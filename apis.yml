aid: espark
name: eSpark
description: >-
  eSpark is a K-5 adaptive learning platform that extends a district's core
  reading and math programs with differentiated, standards-aligned practice in
  reading, math, and writing. The platform uses adaptive lesson sequencing that
  adjusts difficulty to each student's performance, interest-based content, and
  real-time feedback to deliver personalized instruction, and it reports back to
  teachers and administrators on student progress. eSpark serves 10,000+ schools
  and districts nationwide and rosters students through Clever, ClassLink,
  Google Classroom, and QR-code sign-in. eSpark was surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network; it publishes no
  public developer API, so this profile captures company identity, its public
  web properties, and probed domain-security posture rather than API artifacts.
